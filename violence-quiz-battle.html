<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violence in America - Quiz Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eaeaea;
            padding: 20px;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #e94560;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 30px;
        }
        
        .score-board {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .score-box {
            background: #16213e;
            padding: 15px 30px;
            border-radius: 15px;
            text-align: center;
            border: 3px solid;
        }
        
        .score-box.correct {
            border-color: #4caf50;
        }
        
        .score-box.wrong {
            border-color: #ff6b6b;
        }
        
        .score-box .label {
            font-size: 0.9em;
            color: #a0a0a0;
        }
        
        .score-box .value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .question-card {
            background: #16213e;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 3px solid #e94560;
        }
        
        .question-number {
            color: #e94560;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .question-text {
            font-size: 1.3em;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .answers {
            display: grid;
            gap: 12px;
        }
        
        .answer-btn {
            background: #1a1a2e;
            border: 2px solid #333;
            color: #eaeaea;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .answer-btn:hover {
            border-color: #e94560;
            background: #0f0f23;
        }
        
        .answer-btn.correct {
            background: #1a4a3e;
            border-color: #4caf50;
        }
        
        .answer-btn.wrong {
            background: #4a1a1a;
            border-color: #ff6b6b;
        }
        
        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .feedback {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2em;
            display: none;
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback.correct {
            background: #1a4a3e;
            color: #4caf50;
        }
        
        .feedback.wrong {
            background: #4a1a1a;
            color: #ff6b6b;
        }
        
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
        }
        
        .progress-bar {
            background: #1a1a2e;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .progress-fill {
            background: #e94560;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        
        .results {
            text-align: center;
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .final-score {
            font-size: 3em;
            color: #e94560;
            margin: 20px 0;
        }
        
        .grade {
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .grade.a { color: #4caf50; }
        .grade.b { color: #8bc34a; }
        .grade.c { color: #ffc107; }
        .grade.d { color: #ff9800; }
        .grade.f { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Quiz Battle</h1>
        <p class="subtitle">Test Your Knowledge - Feb 12 Prep</p>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>
        
        <div class="score-board">
            <div class="score-box correct">
                <div class="label">Correct</div>
                <div class="value" id="correctCount">0</div>
            </div>
            <div class="score-box wrong">
                <div class="label">Wrong</div>
                <div class="value" id="wrongCount">0</div>
            </div>
        </div>
        
        <div id="quizArea">
            <div class="question-card">
                <div class="question-number" id="questionNumber">Question 1 of 25</div>
                <div class="question-text" id="questionText">Loading...</div>
                <div class="answers" id="answersContainer">
                </div>
            </div>
            
            <div class="feedback" id="feedback"></div>
            
            <div class="controls">
                <button id="nextBtn" onclick="nextQuestion()" style="display: none;">Next Question ➡️</button>
            </div>
        </div>
        
        <div class="results" id="results">
            <div class="final-score" id="finalScore">0/25</div>
            <div class="grade" id="grade"></div>
            <button onclick="restartQuiz()">🔄 Try Again</button>
        </div>
    </div>
    
    <script>
        const quizData = [
            {
                question: "What's the difference between Assault and Battery?",
                answers: ["They're the same thing", "Assault = threats, Battery = contact", "Battery = threats, Assault = contact", "Only Battery is illegal"],
                correct: 1
            },
            {
                question: "Which of these is TRUE about Homicide vs Murder?",
                answers: ["They're legally the same", "All homicide is murder", "All murder is homicide, but not all homicide is murder", "Murder is legal, homicide isn't"],
                correct: 2
            },
            {
                question: "What makes 1st Degree Murder different from 2nd Degree?",
                answers: ["The weapon used", "Premeditation + deliberation", "Only 1st degree has intent", "2nd degree is always an accident"],
                correct: 1
            },
            {
                question: "Excusable Homicide means...",
                answers: ["Any accident", "Accident with negligence", "Accident WITHOUT negligence", "Self-defense"],
                correct: 2
            },
            {
                question: "Justifiable Homicide refers to...",
                answers: ["Reckless killing", "Self-defense", "Manslaughter", "Negligent killing"],
                correct: 1
            },
            {
                question: "Felony Murder applies when...",
                answers: ["Someone is killed during a felony", "The killer has a felony record", "It's a first offense", "The victim committed a felony"],
                correct: 0
            },
            {
                question: "Which states DON'T have felony murder rules?",
                answers: ["Texas and Florida", "New York and California", "Kentucky and Hawaii", "All states have it"],
                correct: 2
            },
            {
                question: "Negligent Manslaughter means the person...",
                answers: ["Planned the killing", "Should've known the risk but didn't", "Knew the risk and ignored it", "Acted in self-defense"],
                correct: 1
            },
            {
                question: "Low serotonin is linked to...",
                answers: ["Planned violence", "Reactive/impulsive violence", "Only property crime", "No violence"],
                correct: 1
            },
            {
                question: "MAOA gene + childhood abuse = ?",
                answers: ["Lower chance of violence", "Higher chance of violence", "No effect on violence", "Only affects females"],
                correct: 1
            },
            {
                question: "General Strain Theory (Agnew) says crime results from...",
                answers: ["Bad parenting", "Can't cope with strain/stress", "Being born violent", "Only poverty"],
                correct: 1
            },
            {
                question: "Social Disorganization Theory focuses on...",
                answers: ["Individual bad choices", "Community/place characteristics", "Genetics only", "Family income only"],
                correct: 1
            },
            {
                question: "Social Learning Theory says violence is...",
                answers: ["Born not made", "Learned through observation", "Only genetic", "Caused by drugs only"],
                correct: 1
            },
            {
                question: "Self-Control Theory says impulsivity is set by...",
                answers: ["Age 8", "Age 18", "Age 25", "Birth"],
                correct: 0
            },
            {
                question: "What percentage of violent crime is assault?",
                answers: ["20%", "50%", "Over 80%", "30%"],
                correct: 2
            },
            {
                question: "Approximately how many violent victimizations in 2022?",
                answers: ["1 million", "2.5 million", "4.5 million", "10 million"],
                correct: 2
            },
            {
                question: "About what percent of batteries are by known persons?",
                answers: ["About half", "10%", "90%", "25%"],
                correct: 0
            },
            {
                question: "Mass shooting definitions...",
                answers: ["Are universal", "Vary by organization", "Only count deaths", "Only the FBI definition matters"],
                correct: 1
            },
            {
                question: "Psychopathy leads to what type of violence?",
                answers: ["Reactive only", "Instrumental (calculated)", "No violence", "Only self-harm"],
                correct: 1
            },
            {
                question: "The Death Penalty is...",
                answers: ["Strong general deterrent", "Weak general deterrent", "Never used", "Only for white collar crime"],
                correct: 1
            },
            {
                question: "Young Male Syndrome is about...",
                answers: ["Hormones only", "Status and face-saving", "Education gaps", "Career choices"],
                correct: 1
            },
            {
                question: "Alcohol acts as a...",
                answers: ["Stimulant for violence", "Disinhibitor", "Deterrent", "Only affects memory"],
                correct: 1
            },
            {
                question: "Frustration-Aggression theory says blocked goals lead to...",
                answers: ["No reaction", "Aggression", "Only sadness", "More goals"],
                correct: 1
            },
            {
                question: "Relative Deprivation focuses on...",
                answers: ["Absolute poverty", "Gap/comparison to others", "Wealth only", "Geography only"],
                correct: 1
            },
            {
                question: "Code of the Street refers to...",
                answers: ["Traffic laws", "Inner city honor culture", "Suburban life", "Police codes"],
                correct: 1
            }
        ];
        
        let currentQuestion = 0;
        let correct = 0;
        let wrong = 0;
        let answered = false;
        
        function loadQuestion() {
            const q = quizData[currentQuestion];
            document.getElementById('questionNumber').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
            document.getElementById('questionText').textContent = q.question;
            
            const answersHtml = q.answers.map((ans, i) => 
                `<button class="answer-btn" onclick="checkAnswer(${i})">${String.fromCharCode(65 + i)}. ${ans}</button>`
            ).join('');
            
            document.getElementById('answersContainer').innerHTML = answersHtml;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').style.display = 'none';
            answered = false;
            
            // Update progress
            const progress = ((currentQuestion) / quizData.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }
        
        function checkAnswer(selected) {
            if (answered) return;
            answered = true;
            
            const q = quizData[currentQuestion];
            const buttons = document.querySelectorAll('.answer-btn');
            const feedback = document.getElementById('feedback');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) {
                    btn.classList.add('correct');
                } else if (i === selected && i !== q.correct) {
                    btn.classList.add('wrong');
                }
            });
            
            if (selected === q.correct) {
                correct++;
                document.getElementById('correctCount').textContent = correct;
                feedback.textContent = "✅ Correct! Great job!";
                feedback.className = "feedback correct show";
            } else {
                wrong++;
                document.getElementById('wrongCount').textContent = wrong;
                feedback.textContent = `❌ Wrong! Correct answer: ${q.answers[q.correct]}`;
                feedback.className = "feedback wrong show";
            }
            
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
        
        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= quizData.length) {
                showResults();
            } else {
                loadQuestion();
            }
        }
        
        function showResults() {
            document.getElementById('quizArea').style.display = 'none';
            document.getElementById('results').classList.add('show');
            document.getElementById('progressBar').style.width = '100%';
            
            const score = correct;
            const total = quizData.length;
            document.getElementById('finalScore').textContent = `${score}/${total}`;
            
            const percentage = (score / total) * 100;
            let grade = document.getElementById('grade');
            
            if (percentage >= 90) {
                grade.textContent = "🌟 A - You're Ready!";
                grade.className = "grade a";
            } else if (percentage >= 80) {
                grade.textContent = "👍 B - Almost There!";
                grade.className = "grade b";
            } else if (percentage >= 70) {
                grade.textContent = "📚 C - Keep Studying!";
                grade.className = "grade c";
            } else if (percentage >= 60) {
                grade.textContent = "😬 D - Review More!";
                grade.className = "grade d";
            } else {
                grade.textContent = "💪 F - Don't Give Up!";
                grade.className = "grade f";
            }
        }
        
        function restartQuiz() {
            currentQuestion = 0;
            correct = 0;
            wrong = 0;
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('wrongCount').textContent = '0';
            document.getElementById('quizArea').style.display = 'block';
            document.getElementById('results').classList.remove('show');
            loadQuestion();
        }
        
        // Initialize
        loadQuestion();
    </script>
</body>
</html>
