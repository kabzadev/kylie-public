<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Psychology Quiz Game 🧠</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .score-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }
        
        .score, .streak {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .score { color: #667eea; }
        .streak { color: #f59e0b; }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px;
            transition: width 0.3s ease;
        }
        
        .question-number {
            text-align: center;
            color: #999;
            margin-bottom: 10px;
        }
        
        .question {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
            text-align: center;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            padding: 18px 20px;
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1em;
            background: white;
        }
        
        .option:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }
        
        .option.correct {
            border-color: #10b981;
            background: #d1fae5;
            animation: pulse 0.5s ease;
        }
        
        .option.incorrect {
            border-color: #ef4444;
            background: #fee2e2;
            animation: shake 0.5s ease;
        }
        
        .option.disabled {
            pointer-events: none;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .feedback {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
            font-size: 1.1em;
            display: none;
        }
        
        .feedback.show { display: block; }
        .feedback.correct { background: #d1fae5; color: #065f46; }
        .feedback.incorrect { background: #fee2e2; color: #991b1b; }
        
        .next-btn {
            display: none;
            width: 100%;
            padding: 18px;
            margin-top: 20px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .next-btn:hover { transform: scale(1.02); }
        .next-btn.show { display: block; }
        
        .results {
            text-align: center;
            display: none;
        }
        
        .results.show { display: block; }
        
        .results h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        .final-score {
            font-size: 4em;
            font-weight: bold;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        
        .grade {
            font-size: 1.5em;
            margin-bottom: 30px;
        }
        
        .play-again {
            padding: 18px 40px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            cursor: pointer;
        }
        
        .start-screen {
            text-align: center;
        }
        
        .start-btn {
            padding: 20px 50px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.3em;
            cursor: pointer;
            margin-top: 30px;
        }
        
        .quiz-content { display: none; }
        .quiz-content.show { display: block; }
        
        .emoji { font-size: 3em; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="start-screen" id="startScreen">
            <div class="emoji">🧠✨</div>
            <h1>Social Psychology</h1>
            <p class="subtitle">Chapters 1-4 Quiz Game</p>
            <p style="color: #666; margin-top: 20px;">15 questions • Learn while you play!</p>
            <button class="start-btn" onclick="startGame()">Let's Go! 🚀</button>
        </div>
        
        <div class="quiz-content" id="quizContent">
            <div class="score-bar">
                <span class="score">Score: <span id="score">0</span></span>
                <span class="streak">🔥 Streak: <span id="streak">0</span></span>
            </div>
            
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            
            <div class="question-number" id="questionNum"></div>
            <div class="question" id="question"></div>
            
            <div class="options" id="options"></div>
            
            <div class="feedback" id="feedback"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
        </div>
        
        <div class="results" id="results">
            <div class="emoji" id="resultEmoji">🎉</div>
            <h2>Quiz Complete!</h2>
            <div class="final-score" id="finalScore">0%</div>
            <div class="grade" id="grade"></div>
            <button class="play-again" onclick="startGame()">Play Again 🔄</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "What is social psychology?",
                options: [
                    "Study of how groups form societies",
                    "Study of how people influence each other's thoughts, feelings, and behaviors",
                    "Study of personality traits",
                    "Study of mental disorders"
                ],
                correct: 1,
                explanation: "Social psych focuses on how we're influenced by others — even imaginary ones!"
            },
            {
                q: "What's the Fundamental Attribution Error?",
                options: [
                    "Making math mistakes",
                    "Blaming the situation for our own failures",
                    "Overestimating personality and underestimating situation when judging others",
                    "Forgetting people's names"
                ],
                correct: 2,
                explanation: "We blame others' personality but our own situations. Classic human move! 😅"
            },
            {
                q: "Who is called the 'Father of Social Psychology'?",
                options: [
                    "Sigmund Freud",
                    "B.F. Skinner",
                    "Kurt Lewin",
                    "Stanley Milgram"
                ],
                correct: 2,
                explanation: "Kurt Lewin! His formula: Behavior = Person × Situation"
            },
            {
                q: "What does 'construal' mean?",
                options: [
                    "Building something",
                    "How we interpret and perceive situations",
                    "A type of research method",
                    "A mental disorder"
                ],
                correct: 1,
                explanation: "It's your personal interpretation of what's happening — and it matters more than 'objective' reality!"
            },
            {
                q: "Correlation does NOT equal...",
                options: [
                    "Relationship",
                    "Connection",
                    "Causation",
                    "Association"
                ],
                correct: 2,
                explanation: "Just because two things happen together doesn't mean one CAUSES the other! 🧠"
            },
            {
                q: "In an experiment, what's the Independent Variable (IV)?",
                options: [
                    "What you measure",
                    "What you manipulate/change",
                    "The control group",
                    "The participants"
                ],
                correct: 1,
                explanation: "IV = what you change. DV = what you measure. Easy way to remember: I manipulate, Dependent responds!"
            },
            {
                q: "What's a schema?",
                options: [
                    "A type of experiment",
                    "Mental framework for organizing information",
                    "A research bias",
                    "A brain scan"
                ],
                correct: 1,
                explanation: "Schemas help us process info quickly — but can become stereotypes when applied to groups!"
            },
            {
                q: "The Availability Heuristic makes us...",
                options: [
                    "Judge by how easily examples come to mind",
                    "Compare things to typical cases",
                    "Start from an anchor number",
                    "Seek confirming evidence"
                ],
                correct: 0,
                explanation: "That's why plane crashes seem common (dramatic & memorable) even though they're super rare! ✈️"
            },
            {
                q: "What's a self-fulfilling prophecy?",
                options: [
                    "Predicting your own future",
                    "When expectations cause someone to act in confirming ways",
                    "Being overconfident",
                    "A type of heuristic"
                ],
                correct: 1,
                explanation: "If a teacher expects a student to fail, they might treat them differently, causing them to actually fail! 😬"
            },
            {
                q: "How many universal facial expressions are there?",
                options: [
                    "4",
                    "5",
                    "6",
                    "8"
                ],
                correct: 2,
                explanation: "The 6: happiness, sadness, anger, fear, surprise, disgust 😊😢😠😨😲🤢"
            },
            {
                q: "Internal attribution means blaming...",
                options: [
                    "The situation",
                    "Other people",
                    "The person's character/personality",
                    "Bad luck"
                ],
                correct: 2,
                explanation: "Internal = personality. External = situation. We tend to use internal for others, external for ourselves!"
            },
            {
                q: "What's the self-serving bias?",
                options: [
                    "Only caring about yourself",
                    "Taking credit for success, blaming situation for failure",
                    "Being selfish in relationships",
                    "Serving yourself first at dinner"
                ],
                correct: 1,
                explanation: "Got an A? 'I'm smart!' Got an F? 'The test was unfair!' We all do this 😂"
            },
            {
                q: "Automatic thinking is...",
                options: [
                    "Slow and effortful",
                    "Always accurate",
                    "Fast, effortless, and unconscious",
                    "Only used by experts"
                ],
                correct: 2,
                explanation: "Automatic = fast but error-prone. Controlled = slow but more accurate. We use automatic most of the time!"
            },
            {
                q: "The planning fallacy makes us...",
                options: [
                    "Plan too much",
                    "Underestimate how long things will take",
                    "Overestimate risks",
                    "Forget to plan"
                ],
                correct: 1,
                explanation: "'This assignment will take 30 minutes!' *3 hours later* ...we've all been there 😅"
            },
            {
                q: "Which cultures show MORE fundamental attribution error?",
                options: [
                    "Collectivistic (Eastern) cultures",
                    "Individualistic (Western) cultures",
                    "Both equally",
                    "Neither"
                ],
                correct: 1,
                explanation: "Western cultures focus more on individuals, so we're quicker to blame personality over situations!"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let streak = 0;
        let shuffledQuestions = [];

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startGame() {
            currentQuestion = 0;
            score = 0;
            streak = 0;
            shuffledQuestions = shuffle(questions);
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('results').classList.remove('show');
            document.getElementById('quizContent').classList.add('show');
            
            updateScore();
            showQuestion();
        }

        function showQuestion() {
            const q = shuffledQuestions[currentQuestion];
            document.getElementById('questionNum').textContent = `Question ${currentQuestion + 1} of ${shuffledQuestions.length}`;
            document.getElementById('question').textContent = q.q;
            document.getElementById('progress').style.width = `${((currentQuestion) / shuffledQuestions.length) * 100}%`;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = opt;
                btn.onclick = () => selectAnswer(i);
                optionsDiv.appendChild(btn);
            });
            
            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('nextBtn').classList.remove('show');
        }

        function selectAnswer(index) {
            const q = shuffledQuestions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            
            options.forEach(opt => opt.classList.add('disabled'));
            
            if (index === q.correct) {
                options[index].classList.add('correct');
                score += 10 + (streak * 2);
                streak++;
                feedback.textContent = `✅ Correct! ${q.explanation}`;
                feedback.classList.add('correct');
            } else {
                options[index].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                streak = 0;
                feedback.textContent = `❌ Not quite! ${q.explanation}`;
                feedback.classList.add('incorrect');
            }
            
            feedback.classList.add('show');
            document.getElementById('nextBtn').classList.add('show');
            updateScore();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= shuffledQuestions.length) {
                showResults();
            } else {
                showQuestion();
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
        }

        function showResults() {
            document.getElementById('quizContent').classList.remove('show');
            document.getElementById('results').classList.add('show');
            
            const maxScore = shuffledQuestions.length * 10;
            const percentage = Math.round((score / maxScore) * 100);
            document.getElementById('finalScore').textContent = `${score} pts`;
            
            let grade, emoji;
            if (percentage >= 90) { grade = "You're a Social Psych Pro! 🏆"; emoji = "🎉"; }
            else if (percentage >= 80) { grade = "Awesome work! 🌟"; emoji = "😎"; }
            else if (percentage >= 70) { grade = "Pretty good! Keep it up! 💪"; emoji = "👍"; }
            else if (percentage >= 60) { grade = "Getting there! Try again? 📚"; emoji = "🤔"; }
            else { grade = "Let's practice more! You got this! 💪"; emoji = "📖"; }
            
            document.getElementById('grade').textContent = grade;
            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('progress').style.width = '100%';
        }
    </script>
</body>
</html>
