<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violence in America - Matching Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eaeaea;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #e94560;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 30px;
        }
        
        .score-board {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            font-size: 1.2em;
        }
        
        .score-item {
            background: #16213e;
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid #e94560;
        }
        
        .score-item span {
            color: #e94560;
            font-weight: bold;
        }
        
        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 600px) {
            .game-area {
                grid-template-columns: 1fr;
            }
        }
        
        .column {
            background: #16213e;
            border-radius: 15px;
            padding: 15px;
        }
        
        .column h3 {
            text-align: center;
            color: #e94560;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e94560;
        }
        
        .card {
            background: #1a1a2e;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .card:hover {
            border-color: #e94560;
            transform: translateX(5px);
        }
        
        .card.selected {
            border-color: #e94560;
            background: #0f0f23;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }
        
        .card.matched {
            background: #1a4a3e;
            border-color: #4caf50;
            opacity: 0.8;
        }
        
        .card.wrong {
            animation: shake 0.5s;
            border-color: #ff6b6b;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .controls {
            text-align: center;
        }
        
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }
        
        button:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
        }
        
        .feedback {
            text-align: center;
            margin: 20px 0;
            font-size: 1.3em;
            min-height: 40px;
        }
        
        .feedback.correct {
            color: #4caf50;
        }
        
        .feedback.wrong {
            color: #ff6b6b;
        }
        
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab {
            background: #16213e;
            color: #a0a0a0;
            border: 2px solid transparent;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab.active {
            border-color: #e94560;
            color: #e94560;
        }
        
        .congrats {
            text-align: center;
            font-size: 1.5em;
            color: #4caf50;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Violence in America</h1>
        <p class="subtitle">Matching Game - Feb 12 Exam Prep</p>
        
        <div class="category-tabs">
            <div class="tab active" onclick="loadCategory('homicide')">🩸 Homicide</div>
            <div class="tab" onclick="loadCategory('theories')">🧠 Theories</div>
            <div class="tab" onclick="loadCategory('biological')">🔬 Biological</div>
            <div class="tab" onclick="loadCategory('concepts')">💡 Concepts</div>
        </div>
        
        <div class="score-board">
            <div class="score-item">Matches: <span id="matches">0</span></div>
            <div class="score-item">Attempts: <span id="attempts">0</span></div>
        </div>
        
        <div class="feedback" id="feedback"></div>
        
        <div class="game-area">
            <div class="column">
                <h3>Term</h3>
                <div id="termsColumn"></div>
            </div>
            <div class="column">
                <h3>Definition</h3>
                <div id="defsColumn"></div>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="shuffleGame()">🔀 Shuffle</button>
            <button onclick="resetGame()">🔄 New Game</button>
        </div>
        
        <div id="congrats" class="congrats" style="display: none;">
            🎉 All matched! Great job! 🎉
        </div>
    </div>
    
    <script>
        const categories = {
            homicide: [
                { term: "Excusable Homicide", def: "Accident, no negligence" },
                { term: "Justifiable Homicide", def: "Self-defense" },
                { term: "1st Degree Murder", def: "Premeditated + deliberated" },
                { term: "2nd Degree Murder", def: "Intentional, not premeditated" },
                { term: "Felony Murder", def: "Kill during felony" },
                { term: "Negligent Manslaughter", def: "Should've known risk" },
                { term: "Reckless Manslaughter", def: "Knew risk, didn't care" }
            ],
            theories: [
                { term: "General Strain Theory", def: "Agnew - can't cope with strain" },
                { term: "Social Disorganization", def: "Community breakdown causes crime" },
                { term: "Social Learning", def: "Violence learned by observation" },
                { term: "Self-Control Theory", def: "Impulsivity set by age 8" },
                { term: "Code of the Street", def: "Respect culture in inner cities" },
                { term: "Classical Strain (Merton)", def: "5 adaptations to blocked goals" }
            ],
            biological: [
                { term: "Low Serotonin", def: "Poor impulse control" },
                { term: "MAOA Gene", def: "Warrior gene + abuse = violence" },
                { term: "Testosterone", def: "Dominance/aggression hormone" },
                { term: "Psychopathy", def: "No empathy = instrumental violence" },
                { term: "Frustration-Aggression", def: "Blocked goal → aggression" },
                { term: "CTE", def: "Brain trauma → violence" }
            ],
            concepts: [
                { term: "80% of Violent Crime", def: "Is simple assault" },
                { term: "4.5 Million", def: "Violent victimizations (2022)" },
                { term: "Young Male Syndrome", def: "Violence for status/face" },
                { term: "Relative Deprivation", def: "Gap comparison → resentment" },
                { term: "Mass Shooting", def: "No universal definition!" },
                { term: "Deterrence", def: "Death penalty = weak general" }
            ]
        };
        
        let currentCategory = 'homicide';
        let selectedTerm = null;
        let selectedDef = null;
        let matches = 0;
        let attempts = 0;
        let matchedPairs = new Set();
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        function loadCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            resetGame();
        }
        
        function initGame() {
            const data = categories[currentCategory];
            const shuffledTerms = shuffleArray([...data]);
            const shuffledDefs = shuffleArray([...data]);
            
            const termsHtml = shuffledTerms.map((item, i) => 
                `<div class="card term-card" data-term="${item.term}" onclick="selectTerm('${item.term}', this)">${item.term}</div>`
            ).join('');
            
            const defsHtml = shuffledDefs.map((item, i) => 
                `<div class="card def-card" data-term="${item.term}" onclick="selectDef('${item.term}', this)">${item.def}</div>`
            ).join('');
            
            document.getElementById('termsColumn').innerHTML = termsHtml;
            document.getElementById('defsColumn').innerHTML = defsHtml;
        }
        
        function selectTerm(term, element) {
            if (matchedPairs.has(term)) return;
            
            document.querySelectorAll('.term-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            selectedTerm = term;
            checkMatch();
        }
        
        function selectDef(term, element) {
            if (matchedPairs.has(term)) return;
            
            document.querySelectorAll('.def-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            selectedDef = term;
            checkMatch();
        }
        
        function checkMatch() {
            if (!selectedTerm || !selectedDef) return;
            
            attempts++;
            document.getElementById('attempts').textContent = attempts;
            
            const feedback = document.getElementById('feedback');
            
            if (selectedTerm === selectedDef) {
                // Match!
                matches++;
                document.getElementById('matches').textContent = matches;
                matchedPairs.add(selectedTerm);
                
                document.querySelectorAll(`[data-term="${selectedTerm}"]`).forEach(c => {
                    c.classList.add('matched');
                    c.classList.remove('selected');
                });
                
                feedback.textContent = "✅ Correct Match!";
                feedback.className = "feedback correct";
                
                // Check win
                if (matches === categories[currentCategory].length) {
                    document.getElementById('congrats').style.display = 'block';
                }
            } else {
                // Wrong
                feedback.textContent = "❌ Not a match - try again!";
                feedback.className = "feedback wrong";
                
                document.querySelectorAll('.card.selected').forEach(c => {
                    c.classList.add('wrong');
                    setTimeout(() => c.classList.remove('wrong'), 500);
                });
            }
            
            selectedTerm = null;
            selectedDef = null;
            setTimeout(() => {
                document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            }, 300);
        }
        
        function shuffleGame() {
            initGame();
        }
        
        function resetGame() {
            matches = 0;
            attempts = 0;
            matchedPairs.clear();
            selectedTerm = null;
            selectedDef = null;
            document.getElementById('matches').textContent = '0';
            document.getElementById('attempts').textContent = '0';
            document.getElementById('feedback').textContent = '';
            document.getElementById('congrats').style.display = 'none';
            initGame();
        }
        
        // Initialize
        initGame();
    </script>
</body>
</html>
